<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المجالات الكهربائية وقانون جاوس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- MathJax: \( ... \) و $ ... $ -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },

    svg: { fontCache: 'global' }
  };

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
  :root {
    --primary-blue: #1e3a8a;
    --blue-600: #2563eb;
    --teal: #0d9488;
    --teal-dark: #0f766e;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --bad: #dc2626;
    --bad-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(180deg, #e0f2fe 0%, var(--bg) 260px);
    color: var(--text);
    line-height: 1.8;
    min-height: 100vh;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 16px 14px 48px; }

  /* ---------- Header ---------- */
  .site-header {
    background: linear-gradient(135deg, var(--primary-blue), var(--teal));
    color: #fff;
    border-radius: 18px;
    padding: 22px 18px;
    text-align: center;
    box-shadow: 0 10px 24px rgba(30, 58, 138, .25);
    margin-bottom: 18px;
  }
  .site-header h1 { margin: 0 0 4px; font-size: 1.7rem; font-weight: 800; }
  .site-header p { margin: 0; opacity: .92; font-size: .95rem; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 16px;
    box-shadow: 0 2px 10px rgba(15, 23, 42, .05);
  }
  .hidden { display: none !important; }

  /* ---------- Login ---------- */
  #login-section { max-width: 440px; margin: 28px auto 0; text-align: center; }
  #login-section h2 { margin: 0 0 6px; color: var(--primary-blue); font-size: 1.3rem; }
  #login-section p.sub { margin: 0 0 18px; color: var(--muted); font-size: .92rem; }
  .field {
    width: 100%;
    padding: 13px 14px;
    font: inherit;
    font-size: 1.1rem;
    text-align: center;
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    background: #f8fafc;
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus { border-color: var(--blue-600); box-shadow: 0 0 0 4px rgba(37, 99, 235, .12); background: #fff; }
  .btn {
    display: inline-block;
    width: 100%;
    margin-top: 14px;
    padding: 13px 16px;
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    background: linear-gradient(135deg, var(--primary-blue), var(--blue-600));
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .08s, opacity .15s;
  }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn.teal { background: linear-gradient(135deg, var(--teal-dark), var(--teal)); }
  #login-error { color: var(--bad); font-weight: 700; min-height: 1.6em; margin-top: 12px; }

  /* ---------- Exam top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, .08);
  }
  #welcome { font-weight: 700; color: var(--primary-blue); font-size: 1rem; }
  .timer {
    direction: ltr;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    color: var(--teal-dark);
    background: #ccfbf1;
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .progress { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin: -4px 4px 14px; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--blue-600)); transition: width .25s; }

  /* ---------- Result banner ---------- */
  #result-banner {
    text-align: center;
    color: #fff;
    border-radius: 18px;
    padding: 22px 16px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--primary-blue), var(--teal));
    box-shadow: 0 10px 24px rgba(30, 58, 138, .25);
  }
  #result-banner .label { opacity: .9; font-size: .95rem; }
  #result-banner .score { font-size: 2.6rem; font-weight: 800; line-height: 1.3; direction: ltr; }
  #result-banner .pct { font-size: 1.05rem; font-weight: 700; }
  #sync-status { margin-top: 10px; font-size: .92rem; background: rgba(255,255,255,.18); display: inline-block; padding: 4px 14px; border-radius: 99px; }
  #retry-btn { margin-top: 10px; width: auto; padding: 8px 18px; font-size: .95rem; background: #fff; color: var(--primary-blue); }

  /* ---------- Questions ---------- */
  .q-card { margin-bottom: 14px; scroll-margin-top: 80px; }
  .q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .q-num {
    flex: none;
    background: var(--primary-blue);
    color: #fff;
    font-weight: 800;
    font-size: .85rem;
    padding: 2px 12px;
    border-radius: 99px;
  }
  .q-text { font-weight: 600; font-size: 1.03rem; }
  .stmts { margin-top: 8px; font-weight: 400; display: grid; gap: 4px; }
  .stmts b { color: var(--primary-blue); }
  .q-img-wrap { text-align: center; margin: 10px 0 12px; }
  .q-img-wrap img {
    max-width: 100%;
    max-height: 340px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: zoom-in;
  }
  .options { display: grid; gap: 8px; margin-top: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    background: #f8fafc;
    transition: border-color .12s, background .12s;
  }
  .opt:hover { border-color: #93c5fd; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .letter {
    flex: none;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: #e2e8f0;
    color: var(--primary-blue);
    font-weight: 800;
    font-size: .9rem;
  }
  .opt .otext { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; }
  .opt .optimg { text-align: center; }
  .opt .optimg img {
    max-width: 100%;
    max-height: 150px;
    background: #fff;
    border-radius: 8px;
    border: 1px solid var(--border);
    vertical-align: middle;
  }
  .opt .missing { color: var(--muted); font-size: .85rem; }
  .opt:has(input:checked) { border-color: var(--blue-600); background: #eff6ff; }
  .opt:has(input:checked) .letter { background: var(--blue-600); color: #fff; }
  .opt:has(input:focus-visible) { outline: 3px solid rgba(37, 99, 235, .35); }

  .q-card.locked .opt { cursor: default; }
  .q-card.locked .opt:hover { border-color: var(--border); }
  .opt.correct { border-color: var(--ok) !important; background: var(--ok-bg) !important; }
  .opt.correct .letter { background: var(--ok) !important; color: #fff !important; }
  .opt.wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
  .opt.wrong .letter { background: var(--bad) !important; color: #fff !important; }

  .feedback { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: .95rem; }
  .feedback.ok { background: var(--ok-bg); color: #14532d; }
  .feedback.bad { background: var(--bad-bg); color: #7f1d1d; }
  .feedback .fb-title { font-weight: 800; margin-bottom: 2px; }
  .feedback .fb-explain { color: var(--text); }

  .submit-wrap { margin-top: 8px; }
  #submit-msg { text-align: center; color: var(--muted); margin-top: 8px; min-height: 1.5em; font-size: .92rem; }

  mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }

  /* ---------- Lightbox ---------- */
  #lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(15, 23, 42, .88);
    display: none; align-items: center; justify-content: center;
    padding: 16px; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; background: #fff; }

  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 26px; }

  @media (min-width: 640px) {
    .site-header h1 { font-size: 2.1rem; }
    .card { padding: 24px 24px; }
    .q-text { font-size: 1.1rem; }
    .options.grid-img { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="site-header">
    <h1>المجالات الكهربائية وقانون جاوس</h1>
    <p id="meta-line"></p>
  </header>

  <!-- ===================== تسجيل الدخول ===================== -->
  <section id="login-section" class="card">
    <h2>تسجيل الدخول للامتحان</h2>
    <p class="sub">أدخل كود الطالب الخاص بك للبدء</p>

           placeholder="كود الطالب (مثال: 18)" aria-label="كود الطالب">

    <div id="questions"></div>

  <footer>المجالات الكهربائية وقانون جاوس • بالتوفيق للجميع</footer>

<script>
/* =====================================================================
   الإعدادات
   ===================================================================== */
const EXAM_META = {
  subject: "فيزياء",
  module: "الكهروستاتيكية",
  lesson: "اختبار على التدفق الكهربائي (2.7)",
  type: "اختبار"
};
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSAFcPEXqQfaFu4P2x1XTgBNsWb_V7OA9AjW_5HBfKB17nL_YcY4iE58AH3bObx5k/exec";

/* الصور داخل مجلد img — اسم الملف = رقم السؤال (مثل img/5.jpg)
   وصور الخيارات: img/4a.png ، img/4b.png ، img/4c.png ، img/4d.png            */
const IMG_DIR = "img";
const IMG_EXTS = ["png", "jpg", "jpeg", "webp", "gif", "svg", "PNG", "JPG", "JPEG", "WEBP"];

/* =====================================================================
   بنك الأسئلة
   img     = اسم ملف الشكل الرئيسي (بدون امتداد)
   optImgs = أسماء ملفات صور الخيارات (إن كانت الخيارات صوراً)
   tag     = نقطة الضعف التي تُسجَّل عند الخطأ
   ===================================================================== */
const QUESTIONS = [
  {
    label: "1", img: "1", tag: "التدفق الكهربائي الكلي عبر سطح مغلق (مجال منتظم)",
    text: String.raw`مكعب مساحة وجهه \(A\) في مجال كهربائي منتظم \(E\)، عمودي على سطح أحد أوجه المكعب. ما هو التدفق الكهربائي الكلي الذي يمر عبر المكعب؟`,
    options: [
      String.raw`\(0\)`,
      String.raw`\(EA\)`,
      String.raw`\(2EA\)`,
      String.raw`\(6EA\)`
    ],
    answer: 0,
    explain: String.raw`يدخل المجال من أحد الأوجه (تدفق سالب \(-EA\)) ويخرج من الوجه المقابل (تدفق موجب \(+EA\))، أما الأوجه الأربعة الأخرى فموازية للمجال وتدفقها صفر. إذن التدفق الكلي \(=-EA+EA=0\).`
  },
  {
    label: "2", img: "2", tag: "التدفق عبر سطح غير مغلق (مكعب ناقص وجه)",
    text: String.raw`يوضح الشكل مكعباً مساحة وجهه \(A\) ووجهاً ناقصاً للمكعب. يوجد هذا المكعب ذو الأوجه الخمسة في مجال كهربائي منتظم \(E\) وعمودي على أحد الأوجه. ما محصلة التدفق الكهربائي الذي يمر عبر المكعب؟`,
    options: [
      String.raw`صفر`,
      String.raw`\(EA\)`,
      String.raw`\(2EA\)`,
      String.raw`\(5EA\)`
    ],
    answer: 1,
    explain: String.raw`الوجه الناقص عمودي على المجال، فيدخل المجال من خلاله (لا يوجد سطح هناك فلا يُحسب له تدفق)، ويخرج من الوجه الخلفي المقابل له فيعطي تدفقاً \(+EA\). أما الأوجه الأربعة الجانبية فموازية للمجال وتدفقها صفر. إذن محصلة التدفق \(=EA\).`
  },
  {
    label: "3", img: "3", tag: "حساب التدفق من مركبات المجال والمساحة",
    text: String.raw`في الشكل المجاور مكعب طول ضلعه \((5.0\,\text{cm})\) يجتازه مجال كهربائي بوحدة \((\text{N/C})\) وفق المعادلة: \(\vec{E}=2.0\,\hat{x}+4.0\,\hat{y}+6.0\,\hat{z}\). ما مقدار التدفق الكهربائي الذي يجتاز الوجهين المظللين للمكعب (الأمامي والأيمن)؟ (ملاحظة: لا توجد شحنات داخل المكعب)`,
    options: [
      String.raw`\(0.005\,\text{N}\!\cdot\!\text{m}^2/\text{C}\)`,
      String.raw`\(0.030\,\text{N}\!\cdot\!\text{m}^2/\text{C}\)`,
      String.raw`\(0.020\,\text{N}\!\cdot\!\text{m}^2/\text{C}\)`,
      String.raw`\(0.015\,\text{N}\!\cdot\!\text{m}^2/\text{C}\)`
    ],
    answer: 2,
    explain: String.raw`مساحة الوجه \(A=(0.05)^2=2.5\times10^{-3}\,\text{m}^2\). الوجه الأمامي عمودي على محور \(z\) فيجتازه المركبة \(E_z=6.0\): \(\Phi=6.0\times2.5\times10^{-3}=0.015\). والوجه الأيمن عمودي على محور \(x\) فيجتازه \(E_x=2.0\): \(\Phi=2.0\times2.5\times10^{-3}=0.005\). المجموع \(=0.020\,\text{N}\!\cdot\!\text{m}^2/\text{C}\).`
  },
  {
    label: "4", img: "4", tag: "التدفق عبر وجه مكعب في مجال منتظم",
    text: String.raw`حسب الشكل، مكعب طول ضلعه \((5.0\,\text{cm})\) في مجال كهربائي منتظم \((E=200\,\text{N/C})\)، عمودي على مستوى أحد أوجه المكعب. ما مقدار التدفق الكهربائي الذي يمر عبر الوجه الأسود؟`,
    options: [
      String.raw`\(0\,\text{N}\!\cdot\!\text{m}^2/\text{C}\)`,
      String.raw`\(-1.0\,\text{N}\!\cdot\!\text{m}^2/\text{C}\)`,
      String.raw`\(-0.5\,\text{N}\!\cdot\!\text{m}^2/\text{C}\)`,
      String.raw`\(-1.5\,\text{N}\!\cdot\!\text{m}^2/\text{C}\)`
    ],
    answer: 2,
    explain: String.raw`المجال يدخل المكعب من الوجه الأسود (الأيسر)، فيكون التدفق سالباً: \(\Phi=-EA=-(200)(0.05)^2=-0.5\,\text{N}\!\cdot\!\text{m}^2/\text{C}\).`
  },
  {
    label: "5", img: "5", tag: "إيجاد طول ضلع المكعب من التدفق",
    text: String.raw`مجال كهربائي منتظم \((E=28\,\text{N/C})\) متعامد على أحد أوجه مكعب كما بالشكل. إذا كان التدفق الكهربائي عبر الوجه الأيسر المظلل يساوي \((-7.0\,\text{N}\!\cdot\!\text{m}^2/\text{C})\)، فما مقدار طول ضلع المكعب؟`,
    options: [
      String.raw`\(L=0.25\,\text{m}\)`,
      String.raw`\(L=0.50\,\text{m}\)`,
      String.raw`\(L=2\,\text{m}\)`,
      String.raw`\(L=19.6\,\text{m}\)`
    ],
    answer: 1,
    explain: String.raw`\(|\Phi|=EA\Rightarrow A=\dfrac{7.0}{28}=0.25\,\text{m}^2\)، ومنها \(L=\sqrt{A}=\sqrt{0.25}=0.50\,\text{m}\).`
  },
  {
    label: "6", img: "6", tag: "التدفق والزاوية بين المجال ومتجه المساحة",
    text: String.raw`في الشكل المقابل: إذا كان التدفق الكهربائي الذي يجتاز السطح \(0.5\,AE\)، فما مقدار الزاوية \(\theta\)؟`,
    options: [
      String.raw`\(30^\circ\)`,
      String.raw`\(45^\circ\)`,
      String.raw`\(90^\circ\)`,
      String.raw`\(60^\circ\)`
    ],
    answer: 3,
    explain: String.raw`\(\Phi=EA\cos\theta=0.5\,AE\Rightarrow\cos\theta=0.5\Rightarrow\theta=60^\circ\) (حيث \(\theta\) هي الزاوية بين متجه المساحة والمجال الكهربائي).`
  }
];

/* =====================================================================
   أدوات مساعدة
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const LETTERS = ["أ", "ب", "ج", "د", "هـ", "و"];

let studentId = "";
let studentName = "";
let startTime = 0;
let timerHandle = null;
let examActive = false;
let submitted = false;
let lastPayload = null;

$("meta-line").textContent = `${EXAM_META.subject} • ${EXAM_META.module} • ${EXAM_META.lesson}`;

function typeset(nodes) {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise(nodes).catch(() => {});
  } else {
    // MathJax لم يُحمَّل بعد: ننتظر انتهاء التحميل
    window.addEventListener("load", () => {
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(nodes).catch(() => {});
    }, { once: true });
  }
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}

/* =====================================================================
   تسجيل الدخول (GET)
   ===================================================================== */
async function login() {
  const errEl = $("login-error");
  const btn = $("login-btn");
  const id = $("student-id").value.trim();
  errEl.textContent = "";

  if (!id) { errEl.textContent = "من فضلك أدخل كود الطالب."; return; }

  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = "جارٍ التحقق...";

  try {
    const res = await fetch(`${SCRIPT_URL}?student_id=${encodeURIComponent(id)}`, { method: "GET", redirect: "follow" });
    const data = await res.json();

    if (data && data.valid === true) {
      studentId = id;
      studentName = data.student_name || "";
      startExam();
    } else {
      errEl.textContent = (data && data.error) ? data.error : "الكود غير مسجل في قاعدة البيانات.";
    }
  } catch (e) {
    errEl.textContent = "تعذر الاتصال بالخادم. تأكد من الإنترنت وحاول مرة أخرى.";
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

/* =====================================================================
   تحميل الصور (يجرّب الامتدادات تلقائياً)
   ===================================================================== */
function tryLoadImage(name, alt, onOk, onFail) {
  let i = 0;
  const img = new Image();
  img.alt = alt;
  img.onload = () => onOk(img);
  img.onerror = () => {
    i++;
    if (i < IMG_EXTS.length) img.src = `${IMG_DIR}/${name}.${IMG_EXTS[i]}`;
    else if (onFail) onFail();
  };
  img.src = `${IMG_DIR}/${name}.${IMG_EXTS[0]}`;
}

function loadMainImage(wrap, name) {
  tryLoadImage(name, `شكل السؤال ${name}`, (img) => {
    img.addEventListener("click", () => openLightbox(img.src));
    wrap.appendChild(img);
    wrap.classList.remove("hidden");
  });
  /* لا توجد صورة لهذا السؤال: يبقى الحاوي مخفياً */
}

function loadOptionImage(holder, name, letter) {
  tryLoadImage(name, `الشكل (${letter})`, (img) => {
    holder.textContent = "";
    holder.appendChild(img);
  }, () => {
    holder.innerHTML = `<span class="missing">الشكل (${letter}) — الصورة غير موجودة: ${IMG_DIR}/${name}</span>`;
  });
}

/* =====================================================================
   عرض الامتحان
   ===================================================================== */
function buildQuestions() {
  const root = $("questions");
  root.innerHTML = "";

  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement("article");
    card.className = "card q-card";
    card.dataset.index = idx;
    card.dataset.tag = q.tag;

    const hasOptImgs = Array.isArray(q.optImgs) && q.optImgs.length > 0;

    const opts = q.options.map((o, i) => `
      <label class="opt" data-i="${i}">
        <input type="radio" name="q${idx}" value="${i}">
        <span class="letter">${LETTERS[i]}</span>
        <span class="otext${hasOptImgs ? " optimg" : ""}">${o}</span>
      </label>`).join("");

    card.innerHTML = `
      <div class="q-head"><span class="q-num">السؤال ${q.label}</span></div>
      <div class="q-text">${q.text}</div>
      <div class="q-img-wrap hidden"></div>
      <div class="options${hasOptImgs ? " grid-img" : ""}">${opts}</div>
      <div class="feedback hidden"></div>`;

    root.appendChild(card);

    if (q.img) loadMainImage(card.querySelector(".q-img-wrap"), q.img);
    if (hasOptImgs) {
      card.querySelectorAll(".optimg").forEach((holder, i) => {
        loadOptionImage(holder, q.optImgs[i], LETTERS[i]);
      });
    }
  });

  root.addEventListener("change", updateProgress);
  typeset([root]);
}

function updateProgress() {
  let answered = 0;
  QUESTIONS.forEach((_, idx) => {
    if (document.querySelector(`input[name="q${idx}"]:checked`)) answered++;
  });
  $("progress-bar").style.width = (answered / QUESTIONS.length * 100) + "%";
  if (!submitted) $("submit-msg").textContent = `تمت الإجابة على ${answered} من ${QUESTIONS.length}`;
}

function startExam() {
  $("login-section").classList.add("hidden");
  $("exam-section").classList.remove("hidden");
  $("welcome").textContent = `مرحباً بك: ${studentName}`;

  buildQuestions();
  updateProgress();

  examActive = true;
  startTime = Date.now();
  timerHandle = setInterval(() => {
    $("timer").textContent = fmtTime(Math.floor((Date.now() - startTime) / 1000));
  }, 1000);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =====================================================================
   التصحيح والإرسال (POST)
   ===================================================================== */
/* نص الخيار كما يُسجَّل في الشيت (بدون وسوم HTML أو علامات MathJax) */
function plain(html, q, i) {
  if (Array.isArray(q.optImgs) && q.optImgs.length) return `الشكل (${LETTERS[i]}) - ${q.optImgs[i]}`;
  return String(html)
    .replace(/<[^>]*>/g, "")
    .replace(/\\\(|\\\)/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function gradeExam() {
  let score = 0;
  const weaknesses = new Set();
  const details = [];

  QUESTIONS.forEach((q, idx) => {
    const card = document.querySelector(`.q-card[data-index="${idx}"]`);
    const checked = card.querySelector(`input[name="q${idx}"]:checked`);
    const selected = checked ? parseInt(checked.value, 10) : -1;
    const isCorrect = selected === q.answer;
    if (isCorrect) score++; else weaknesses.add(q.tag);

    details.push({
      question: q.label,
      selected: selected >= 0 ? LETTERS[selected] : null,
      selectedText: selected >= 0 ? plain(q.options[selected], q, selected) : "",
      correct: LETTERS[q.answer],
      correctText: plain(q.options[q.answer], q, q.answer),
      isCorrect,
      tag: q.tag
    });
  });

  return { score, weaknesses: [...weaknesses], details };
}

function showFeedback() {
  QUESTIONS.forEach((q, idx) => {
    const card = document.querySelector(`.q-card[data-index="${idx}"]`);
    card.classList.add("locked");
    card.querySelectorAll("input").forEach((i) => (i.disabled = true));

    const checked = card.querySelector(`input[name="q${idx}"]:checked`);
    const selected = checked ? parseInt(checked.value, 10) : -1;
    const ok = selected === q.answer;

    card.querySelectorAll(".opt").forEach((el) => {
      const i = parseInt(el.dataset.i, 10);
      if (i === q.answer) el.classList.add("correct");
      else if (i === selected) el.classList.add("wrong");
    });

    const fb = card.querySelector(".feedback");
    fb.classList.remove("hidden", "ok", "bad");
    fb.classList.add(ok ? "ok" : "bad");
    const title = ok
      ? "✅ إجابة صحيحة"
      : (selected === -1
          ? `❌ لم تجب على هذا السؤال — الإجابة الصحيحة: ${LETTERS[q.answer]}`
          : `❌ إجابة خاطئة — الإجابة الصحيحة: ${LETTERS[q.answer]}`);
    fb.innerHTML = `<div class="fb-title">${title}</div><div class="fb-explain">${q.explain}</div>`;
  });
  typeset([$("questions")]);
}

function showBanner(score, total, timeSeconds) {
  const pct = Math.round((score / total) * 100);
  const banner = $("result-banner");
  banner.classList.remove("hidden");
  banner.innerHTML = `
    <div class="label">نتيجتك يا ${studentName}</div>
    <div class="score">${score} / ${total}</div>
    <div class="pct">${pct}% • الوقت: ${fmtTime(timeSeconds)}</div>
    <div id="sync-status">جارٍ حفظ النتيجة...</div>
    <div><button id="retry-btn" class="btn hidden">إعادة محاولة الحفظ</button></div>`;
  $("retry-btn").addEventListener("click", () => sendResult(lastPayload));
}

function setSync(msg) { const el = $("sync-status"); if (el) el.textContent = msg; }

async function sendResult(payload) {
  const retry = $("retry-btn");
  if (retry) retry.classList.add("hidden");
  setSync("جارٍ حفظ النتيجة...");

  const body = JSON.stringify(payload);
  try {
    /* text/plain يتجنب طلب preflight مع Google Apps Script */
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body,
      redirect: "follow"
    });
    let data = null;
    try { data = await res.json(); } catch (_) { /* قد لا يكون الرد JSON */ }

    if (res.ok && !(data && (data.error || data.success === false))) {
      setSync("✅ تم حفظ نتيجتك بنجاح");
    } else {
      setSync("⚠️ تعذر حفظ النتيجة: " + ((data && data.error) || "خطأ في الخادم"));
      if (retry) retry.classList.remove("hidden");
    }
  } catch (e) {
    /* احتمال حجب CORS: نعيد الإرسال بوضع no-cors (لا يمكن قراءة الرد) */
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body
      });
      setSync("✅ تم إرسال نتيجتك");
    } catch (e2) {
      setSync("⚠️ تعذر الاتصال بالخادم، لم يتم حفظ النتيجة");
      if (retry) retry.classList.remove("hidden");
    }
  }
}

async function submitExam() {
  if (submitted) return;

  let unanswered = 0;
  QUESTIONS.forEach((_, idx) => {
    if (!document.querySelector(`input[name="q${idx}"]:checked`)) unanswered++;
  });
  if (unanswered > 0 &&
      !confirm(`لم تجب على ${unanswered} سؤال/أسئلة. هل تريد إنهاء الامتحان وإرسال النتيجة؟`)) return;

  const btn = $("submit-btn");
  btn.disabled = true;
  btn.textContent = "جارٍ التصحيح والإرسال...";

  submitted = true;
  examActive = false;
  clearInterval(timerHandle);
  const timeSeconds = Math.floor((Date.now() - startTime) / 1000);

  const { score, weaknesses, details } = gradeExam();
  const total = QUESTIONS.length;

  showFeedback();
  showBanner(score, total, timeSeconds);
  $("submit-msg").textContent = "";
  btn.classList.add("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });

  lastPayload = {
    studentId: String(studentId),
    subject: EXAM_META.subject,
    module: EXAM_META.module,
    lesson: EXAM_META.lesson,
    assessmentType: EXAM_META.type,
    score,
    total,
    timeSeconds,
    weaknesses,
    details
  };
  await sendResult(lastPayload);
}

/* =====================================================================
   تكبير الصور
   ===================================================================== */
function openLightbox(src) {
  const lb = $("lightbox");
  lb.querySelector("img").src = src;
  lb.classList.add("open");
  lb.setAttribute("aria-hidden", "false");
}
$("lightbox").addEventListener("click", () => {
  $("lightbox").classList.remove("open");
  $("lightbox").setAttribute("aria-hidden", "true");
});

/* =====================================================================
   ربط الأحداث
   ===================================================================== */
$("login-btn").addEventListener("click", login);
$("student-id").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("submit-btn").addEventListener("click", submitExam);

window.addEventListener("beforeunload", (e) => {
  if (examActive && !submitted) { e.preventDefault(); e.returnValue = ""; }
});
</script>
